[settings]
experimental = true
lockfile = true

[tools]
"aqua:fish-shell/fish-shell" = "latest"
lazygit = "latest"
croc = "latest"
opencode = "latest"
bun = "latest"
neovim = "latest"
"npm:ocx" = "latest"
dotenvx = "latest"
aws-vault = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
pnpm = "latest"

[tasks]
# GitHub container token tasks
[tasks.fishing]
description = "Initialize remote fish session"
shell = "fish"
run = '''
  fish_add_path ./bin/mise
'''
