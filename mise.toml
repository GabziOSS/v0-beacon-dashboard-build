[tools]
"aqua:fish-shell/fish-shell" = "latest"
croc = "latest"
neovim = "latest"
lazygit = "latest"
aws-vault = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
node = "lts/krypton"
pnpm = "latest"
bun = "latest"
dotenvx = "latest"
opencode = "latest"
"npm:ocx" = "latest"
"npm:@vudovn/ag-kit" = "latest"
"npm:nx" = "latest"
"npm:turbo" = "latest"

[settings]
experimental = true
lockfile = true

[env]
OC_PORT = 2026
# OCX_PROFILE = "omo-free"

[shell_alias]
ms = "./bin/mise"

[tasks]
oc-web = "dotenvx run -f ./.env._oc -- ocx oc -- web --port $OC_PORT"
oc-at = "dotenvx run -f ./.env._oc -- ocx oc -- attach localhost:$OC_PORT"
oc = "dotenvx run -f ./.env._oc -- ocx oc"

[tasks.omo-setup-auto]
run = '''
  bunx oh-my-opencode-slim install --no-tui '--skills=yes' '--tmux=no' \
    '--opencode-free=yes' '--opencode-free-model=auto' \
    '--kimi=no' '--openai=no' '--anthropic=no' '--copilot=no' \
    '--zai-plan=no' '--antigravity=no' '--chutes=no' 
'''
